{% extends 'base.html' %}

{% block title %}Login - ICU System{% endblock %}

{% block content %}
<div class="card login-card">
    <h1>Doctor Login</h1>
    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
    <p class="muted">Demo account can be seeded with scripts/seed_users.py</p>
</div>
{% endblock %}
